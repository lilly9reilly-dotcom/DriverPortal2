<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="globalTint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#04122a" stop-opacity="0.62"/>
      <stop offset="45%" stop-color="#07204a" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#030d22" stop-opacity="0.66"/>
    </linearGradient>

    <radialGradient id="leftGlow" cx="0.16" cy="0.34" r="0.52">
      <stop offset="0%" stop-color="#3a86ff" stop-opacity="0.30"/>
      <stop offset="60%" stop-color="#3a86ff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#3a86ff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="centerFocus" cx="0.50" cy="0.52" r="0.38">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="formZone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#041738" stop-opacity="0.10"/>
      <stop offset="50%" stop-color="#061c44" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#041738" stop-opacity="0.10"/>
    </linearGradient>

    <linearGradient id="arcRedGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b70c1d"/>
      <stop offset="100%" stop-color="#f0ba62"/>
    </linearGradient>

    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>

    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- Base realistic scene supplied by project image -->
  <image href="login1-bg.jpg" x="0" y="0" width="1920" height="1080" preserveAspectRatio="xMidYMid slice"/>

  <!-- Cinematic grading -->
  <rect width="1920" height="1080" fill="url(#globalTint)"/>
  <rect width="1920" height="1080" fill="url(#leftGlow)"/>
  <rect width="1920" height="1080" fill="url(#centerFocus)"/>

  <!-- Dedicated clean visual zone for login form -->
  <rect x="620" y="140" width="680" height="800" rx="34" fill="url(#formZone)"/>
  <rect x="650" y="170" width="620" height="740" rx="30" fill="#041a3d" fill-opacity="0.16" stroke="#ffffff" stroke-opacity="0.16"/>

  <!-- Subtle light streaks -->
  <g opacity="0.22" filter="url(#softBlur)">
    <path d="M-60 340 C280 220 620 210 980 260" stroke="#56a7ff" stroke-width="4" fill="none"/>
    <path d="M80 390 C440 290 780 295 1180 360" stroke="#4fa0ff" stroke-width="3" fill="none"/>
    <path d="M860 230 C1130 170 1440 190 1800 300" stroke="#7cc4ff" stroke-width="2" fill="none"/>
  </g>

  <!-- Signature red-gold arcs -->
  <g opacity="0.72">
    <path d="M-40 48 C240 -12 520 -10 860 72" fill="none" stroke="url(#arcRedGold)" stroke-width="20"/>
    <path d="M-20 78 C300 2 620 6 920 86" fill="none" stroke="#f3d89f" stroke-width="6" opacity="0.82"/>
    <path d="M1020 1048 C1370 956 1660 960 1960 1028" fill="none" stroke="url(#arcRedGold)" stroke-width="18"/>
    <path d="M940 1074 C1300 980 1620 986 1980 1058" fill="none" stroke="#f3d89f" stroke-width="5" opacity="0.76"/>
  </g>

  <!-- Vignette -->
  <rect width="1920" height="1080" fill="#000000" opacity="0.22"/>
  <rect width="1920" height="1080" fill="none" stroke="#000000" stroke-opacity="0.40" stroke-width="120"/>

  <!-- Fine cinematic grain -->
  <rect width="1920" height="1080" filter="url(#grain)" opacity="0.035"/>
</svg>
