<!-- شعار الشركة SVG -->
<svg id="companyLogo" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" style="display: none;">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- خلفية الدائرة -->
  <circle cx="100" cy="100" r="95" fill="url(#logoGradient)" />
  
  <!-- شاحنة النقل -->
  <g transform="translate(100, 100)">
    <!-- الحاوية -->
    <rect x="-35" y="-25" width="50" height="35" fill="white" rx="3" />
    
    <!-- الإطار -->
    <rect x="-60" y="-8" width="120" height="16" fill="none" stroke="white" stroke-width="2" />
    
    <!-- العجلات -->
    <circle cx="-30" cy="20" r="8" fill="white" />
    <circle cx="30" cy="20" r="8" fill="white" />
    
    <!-- الكابينة -->
    <rect x="-50" y="-20" width="15" height="28" fill="white" rx="2" />
    <rect x="-47" y="-18" width="9" height="8" fill="#667eea" />
  </g>
</svg>

<!-- أيقونات إدارة البيانات -->
<svg id="dataManagementIcon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" style="display: none;">
  <rect x="10" y="15" width="30" height="70" fill="#667eea" rx="3" />
  <rect x="45" y="30" width="30" height="55" fill="#4facfe" rx="3" />
  <rect x="80" y="10" width="30" height="75" fill="#764ba2" rx="3" />
</svg>

<!-- أيقونة التتبع -->
<svg id="trackingIcon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" style="display: none;">
  <circle cx="50" cy="50" r="40" fill="none" stroke="#27ae60" stroke-width="2" />
  <circle cx="50" cy="50" r="25" fill="none" stroke="#27ae60" stroke-width="2" />
  <circle cx="50" cy="50" r="10" fill="#27ae60" />
  <path d="M 50 50 L 70 30" stroke="#e74c3c" stroke-width="2" stroke-linecap="round" />
</svg>

<!-- أيقونة الحسابات -->
<svg id="accountingIcon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" style="display: none;">
  <rect x="10" y="10" width="80" height="80" fill="none" stroke="#f39c12" stroke-width="2" rx="5" />
  <line x1="10" y1="30" x2="90" y2="30" stroke="#f39c12" stroke-width="2" />
  <line x1="10" y1="50" x2="90" y2="50" stroke="#f39c12" stroke-width="2" />
  <line x1="10" y1="70" x2="90" y2="70" stroke="#f39c12" stroke-width="2" />
  <line x1="35" y1="10" x2="35" y2="90" stroke="#f39c12" stroke-width="2" />
  <line x1="65" y1="10" x2="65" y2="90" stroke="#f39c12" stroke-width="2" />
</svg>
