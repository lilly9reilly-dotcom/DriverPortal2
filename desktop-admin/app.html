<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة مدير الحسابات</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <div class="login-shell" id="loginShell">
    <div class="login-card">
      <h1 id="loginTitle">لوحة مدير الحسابات</h1>
      <p class="sub">دخول آمن للوصول إلى كل تبويبات النظام</p>

      <label for="passwordInput">كلمة المرور</label>
      <input id="passwordInput" type="password" placeholder="ادخل كلمة المرور" autocomplete="current-password" />

      <button id="loginBtn">دخول</button>
      <p class="hint" id="passwordHint"></p>
      <p class="error" id="loginError"></p>
    </div>
  </div>

  <div class="app-shell hidden" id="appShell">
    <aside class="sidebar">
      <div class="brand" id="appTitle">لوحة مدير الحسابات</div>
      <div class="tabs" id="tabs"></div>
      <button class="logout" id="logoutBtn">تسجيل الخروج</button>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h2 id="activeTabTitle">-</h2>
          <p>وصول موحد إلى الداشبورد وعمليات Google Sheet</p>
        </div>
      </header>

      <section class="viewer-wrap">
        <div class="loader" id="viewerLoader">جاري تحميل الصفحة...</div>
        <iframe id="viewer" title="System Viewer" sandbox="allow-forms allow-scripts allow-same-origin allow-popups allow-downloads"></iframe>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
