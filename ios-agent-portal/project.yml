name: AgentPortal
options:
  deploymentTarget:
    iOS: "16.0"
  generateEmptyDirectories: true
settings:
  BASE_SETTINGS:
    SWIFT_VERSION: "5.0"
targets:
  AgentPortal:
    type: application
    platform: iOS
    sources:
      - path: AgentPortal
    settings:
      base:
        PRODUCT_NAME: AgentPortal
        PRODUCT_BUNDLE_IDENTIFIER: iq.namoothajia.agentportal
        INFOPLIST_FILE: AgentPortal/Info.plist
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
